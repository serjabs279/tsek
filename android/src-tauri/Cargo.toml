[package]
name = "tsek-android"
version = "0.1.0"
description = "Tsek for Android — camera answer-sheet checker"
authors = ["Richmond C. Jabla"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tsek_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
